# Builds and tests every branch. On main, once both pass, tags v<version> from
# /VERSION (the single app version). The patch bump happens in the commit
# itself (.githooks/pre-commit); for a minor/major release, edit VERSION by hand.
name: CI

on:
  push:
    branches:
      - '**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4

      # mongodb-memory-server downloads a MongoDB binary on first use
      # (into backend/.mongo-binaries, see __tests__/helpers/setup.js).
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: backend/.mongo-binaries
          key: mongo-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run build

      - name: Test backend
        run: npm test

  version:
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Tag v<version>
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null; then
            echo "$TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
