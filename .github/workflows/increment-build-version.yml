# The version is bumped inside each commit on main by .githooks/pre-commit; this only checks the build.
name: Build

on:
  push:
    branches:
      - '**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4

      # mongodb-memory-server downloads a MongoDB binary on first use
      # (into backend/.mongo-binaries, see __tests__/helpers/setup.js).
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: backend/.mongo-binaries
          key: mongo-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run build

      - name: Test backend
        run: npm test
